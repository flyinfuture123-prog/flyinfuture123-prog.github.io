name: 離線流程檢查

# 每日排程真的跑起來才發現 script 有語法錯誤，代價是漏掉一天的資料。
# 這個 workflow 用固定的離線 fixture 把整條流程跑一遍，不碰任何外部網站，
# 所以 push / PR 當下就能抓到問題。
on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
      - "patentmap-4b9c7e2a51d8f306/data/**"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "patentmap-4b9c7e2a51d8f306/data/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 模組自我檢查（台股站）
        run: |
          python scripts/lexicon.py
          python scripts/stocks.py > /dev/null
          python scripts/analyze.py > /dev/null
          python scripts/llm.py

      - name: 用離線 fixture 跑完整條流程（台股站）
        run: |
          python tests/make_fixture.py /tmp/fixture.json
          python scripts/build.py \
            --site-dir /tmp/site-check \
            --fixture /tmp/fixture.json \
            --no-llm

      - name: 檢查產出（台股站）
        run: python tests/test_pipeline.py /tmp/site-check/data/latest.json

      - name: 模組自我檢查（時尚站）
        run: |
          python scripts/fashion_brands.py > /dev/null
          python scripts/fashion_lexicon.py
          python scripts/fashion_analyze.py > /dev/null
          python scripts/fashion_llm.py

      - name: 用離線 fixture 跑完整條流程（時尚站）
        run: |
          python tests/make_fashion_fixture.py /tmp/fashion_fixture.json
          python scripts/fashion_build.py \
            --site-dir /tmp/fashion-site-check \
            --fixture /tmp/fashion_fixture.json \
            --no-llm

      - name: 檢查產出（時尚站）
        run: python tests/test_fashion_pipeline.py /tmp/fashion-site-check/data/latest.json

      # patentmap 站的 data/book.json 是由 scripts/patentmap/ 的模組產生的。
      # 只改模組沒重跑產生器（或反過來直接手改 json），頁面就會跟原始資料對不上，
      # 而且不會有任何錯誤訊息。這一步把兩邊比對起來。
      - name: 檢查 patentmap 資料檔與產生器同步
        run: |
          python scripts/patentmap_build.py /tmp/patentmap-book.json
          diff -u patentmap-4b9c7e2a51d8f306/data/book.json /tmp/patentmap-book.json \
            || { echo "::error::data/book.json 與 scripts/patentmap_build.py 的產出不一致，請重跑產生器"; exit 1; }
